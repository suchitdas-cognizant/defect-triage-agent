<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Defect Triaging Agent Architecture</title>
  <desc id="desc">Architecture diagram for a code-companion based defect triage workflow with repository knowledge, reusable prompt, Markdown report, human review, and issue tracker handoff.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #d8dee9; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #9aa7bd; stroke-width: 2; rx: 10; }
      .primary { fill: #eef6ff; stroke: #3178c6; }
      .knowledge { fill: #f3fbf5; stroke: #3c9b62; }
      .output { fill: #fff7e8; stroke: #c78322; }
      .review { fill: #f8f0ff; stroke: #8a5cc2; }
      .title { font: 700 30px Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #4b5563; }
      .section { font: 700 18px Arial, sans-serif; fill: #111827; }
      .label { font: 700 16px Arial, sans-serif; fill: #111827; }
      .text { font: 400 14px Arial, sans-serif; fill: #374151; }
      .small { font: 400 12px Arial, sans-serif; fill: #4b5563; }
      .mono { font: 400 13px Consolas, monospace; fill: #374151; }
      .arrow { stroke: #5b667a; stroke-width: 2.4; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 7 6; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#5b667a" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="760" />

  <text class="title" x="64" y="58">Defect Triaging Agent Architecture</text>
  <text class="subtitle" x="64" y="86">Repository-native workflow using a code companion: no separate LLM API key, hosted backend, vector database, or dashboard required.</text>

  <rect class="panel" x="48" y="118" width="1184" height="572" rx="18" />
  <text class="section" x="80" y="158">End-to-End Flow</text>

  <!-- Input -->
  <rect class="box primary" x="80" y="214" width="190" height="118" rx="10" />
  <text class="label" x="108" y="246">Incoming Defect</text>
  <text class="text" x="108" y="276">Title, description,</text>
  <text class="text" x="108" y="298">environment, logs,</text>
  <text class="text" x="108" y="320">reporter, area</text>

  <!-- Knowledge -->
  <rect class="box knowledge" x="360" y="168" width="250" height="226" rx="10" />
  <text class="label" x="392" y="202">Repository Knowledge</text>
  <text class="mono" x="392" y="234">docs/ownership-map.md</text>
  <text class="mono" x="392" y="260">docs/severity-rules.md</text>
  <text class="mono" x="392" y="286">data/sample-defects.json</text>
  <text class="mono" x="392" y="312">templates/report.md</text>
  <text class="small" x="392" y="348">Plain files capture SME</text>
  <text class="small" x="392" y="368">knowledge and rules.</text>

  <!-- Prompt -->
  <rect class="box primary" x="700" y="214" width="220" height="118" rx="10" />
  <text class="label" x="732" y="246">Code Companion</text>
  <text class="mono" x="732" y="276">prompts/defect-</text>
  <text class="mono" x="732" y="298">triage-prompt.md</text>
  <text class="small" x="732" y="322">Codex / Copilot / Claude Code</text>

  <!-- Report -->
  <rect class="box output" x="1010" y="214" width="170" height="118" rx="10" />
  <text class="label" x="1040" y="246">Markdown</text>
  <text class="label" x="1040" y="268">Triage Report</text>
  <text class="mono" x="1040" y="298">reports/*.md</text>
  <text class="small" x="1040" y="322">Issue-comment ready</text>

  <!-- Reasoning steps -->
  <rect class="box" x="360" y="454" width="560" height="126" rx="10" />
  <text class="label" x="392" y="488">Prompt Workflow</text>
  <text class="text" x="392" y="520">1. Normalize defect  2. Map owner  3. Compare historical defects</text>
  <text class="text" x="392" y="546">4. Apply severity rules  5. Identify missing information</text>
  <text class="text" x="392" y="572">6. Produce assessment, recommendations, risks, coverage, and actions</text>

  <!-- Human review -->
  <rect class="box review" x="1010" y="454" width="170" height="126" rx="10" />
  <text class="label" x="1040" y="490">Human Review</text>
  <text class="text" x="1040" y="520">QA lead or</text>
  <text class="text" x="1040" y="542">developer approves</text>
  <text class="text" x="1040" y="564">routing decision</text>

  <!-- Issue tracker -->
  <rect class="box output" x="80" y="454" width="190" height="126" rx="10" />
  <text class="label" x="108" y="490">Issue Tracker</text>
  <text class="text" x="108" y="520">Paste report as</text>
  <text class="text" x="108" y="542">comment, labels,</text>
  <text class="text" x="108" y="564">owner, escalation</text>

  <!-- Arrows -->
  <path class="arrow" d="M270 273 H360" />
  <path class="arrow" d="M610 273 H700" />
  <path class="arrow" d="M920 273 H1010" />
  <path class="arrow" d="M810 332 V454" />
  <path class="arrow" d="M920 517 H1010" />
  <path class="arrow" d="M1010 517 C790 652, 470 652, 270 517" />

  <!-- Knowledge to workflow dashed -->
  <path class="arrow dashed" d="M485 394 V454" />
  <path class="arrow dashed" d="M610 332 C660 360, 705 395, 735 454" />

  <!-- Footer badges -->
  <rect x="80" y="626" width="190" height="34" rx="17" fill="#eef2ff" stroke="#7c8bd6" />
  <text class="small" x="104" y="648">No separate LLM API key</text>
  <rect x="300" y="626" width="160" height="34" rx="17" fill="#eef2ff" stroke="#7c8bd6" />
  <text class="small" x="326" y="648">No hosted backend</text>
  <rect x="490" y="626" width="170" height="34" rx="17" fill="#eef2ff" stroke="#7c8bd6" />
  <text class="small" x="516" y="648">Markdown output</text>
  <rect x="690" y="626" width="176" height="34" rx="17" fill="#eef2ff" stroke="#7c8bd6" />
  <text class="small" x="716" y="648">Repository-native</text>
  <rect x="896" y="626" width="196" height="34" rx="17" fill="#eef2ff" stroke="#7c8bd6" />
  <text class="small" x="922" y="648">Human-reviewed routing</text>
</svg>
